<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>وقتي – تنظيم المهام</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ff;--surface:#ffffff;--text:#1e1038;--muted:#6b5b95;--line:#e4dcfb;
  --p900:#2e1065;--p700:#6d28d9;--p500:#8b5cf6;--p300:#c4b5fd;--p100:#ede9fe;
  --hi:#be185d;--mid:#7c3aed;--lo:#0f766e;--danger:#b91c1c;
  --grad:linear-gradient(135deg,#4c1d95 0%,#7c3aed 55%,#a78bfa 100%);
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#140a2b;--surface:#1f1240;--text:#f1ebff;--muted:#b8a6e6;--line:#352360;
  --p100:#2b1a55;--p300:#7c5cd6;--hi:#f472b6;--mid:#c4b5fd;--lo:#5eead4;--danger:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#140a2b;--surface:#1f1240;--text:#f1ebff;--muted:#b8a6e6;--line:#352360;
  --p100:#2b1a55;--p300:#7c5cd6;--hi:#f472b6;--mid:#c4b5fd;--lo:#5eead4;--danger:#f87171;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--p500);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 48px}
header{background:var(--grad);color:#fff;border-radius:0 0 28px 28px;padding:28px 20px 70px;margin:0 -16px}
.top{display:flex;justify-content:space-between;align-items:center;max-width:820px;margin:0 auto;padding:0 4px}
h1{margin:0;font-size:2rem;font-weight:700}
.sub{margin:4px 0 0;opacity:.85;font-size:.95rem}
.ibtn{background:rgba(255,255,255,.18);border:0;color:#fff;width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:1.1rem}
.ibtn:hover{background:rgba(255,255,255,.3)}
.progress{max-width:820px;margin:22px auto 0;padding:0 4px}
.progress .row{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:6px}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#fff;border-radius:99px;transition:width .4s}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;margin-top:-44px;box-shadow:0 10px 30px rgba(76,29,149,.15)}
.search{width:100%;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg)}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
select{padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);width:100%}
.add{width:100%;margin-top:12px;padding:13px;border:0;border-radius:14px;background:var(--grad);color:#fff;font-weight:700;cursor:pointer;font-size:1rem}
.add:hover{filter:brightness(1.08)}
.count{margin:18px 4px 8px;color:var(--muted);font-size:.9rem}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-inline-start:6px solid var(--mid);border-radius:16px;padding:12px 14px}
li.p-high{border-inline-start-color:var(--hi)}li.p-low{border-inline-start-color:var(--lo)}
li.done .t{text-decoration:line-through;opacity:.55}
.chk{width:22px;height:22px;accent-color:var(--p700);margin-top:5px;flex:none;cursor:pointer}
.body{flex:1;min-width:0}
.t{font-weight:700;overflow-wrap:anywhere}
.n{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--p100);color:var(--p700);border-radius:99px;padding:1px 10px;font-size:.8rem}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip{color:var(--p300)}}
:root[data-theme="dark"] .chip{color:var(--p300)}
.chip.late{background:var(--danger);color:#fff}
.acts{display:flex;gap:4px;flex:none}
.acts button{background:var(--p100);border:0;border-radius:10px;padding:6px 10px;cursor:pointer;font-size:.85rem}
.acts button:hover{background:var(--p300)}
.acts .del.sure{background:var(--danger);color:#fff}
.empty{text-align:center;color:var(--muted);padding:40px 10px;border:2px dashed var(--line);border-radius:16px}
dialog{border:0;border-radius:22px;padding:0;width:min(440px,92vw);background:var(--surface);color:var(--text);box-shadow:0 20px 60px rgba(46,16,101,.4)}
dialog::backdrop{background:rgba(30,10,60,.55)}
form{padding:20px;display:grid;gap:12px}
form h2{margin:0;font-size:1.25rem;color:var(--p700)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) form h2{color:var(--p300)}}
:root[data-theme="dark"] form h2{color:var(--p300)}
label{display:grid;gap:4px;font-size:.9rem;color:var(--muted)}
input,textarea{padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:10px;margin-top:4px}
.btns button{flex:1;padding:12px;border-radius:12px;border:0;font-weight:700;cursor:pointer}
.save{background:var(--grad);color:#fff}
.cancel{background:var(--p100);color:var(--text)}
@media (max-width:520px){.filters{grid-template-columns:1fr}.two{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.tabs button{flex:1;white-space:nowrap;padding:8px 12px;border-radius:99px;border:1.5px solid var(--line);background:transparent;cursor:pointer}
.tabs button.on{background:var(--grad);color:#fff;border-color:transparent}
.tools{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.ghost{background:var(--p100);border:0;border-radius:12px;padding:0 14px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center}
.stats b{display:block;font-size:1.5rem;color:var(--p700)}
.stats span{font-size:.78rem;color:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stats b{color:var(--p300)}}
:root[data-theme="dark"] .stats b{color:var(--p300)}
.pomo{margin-top:12px;background:var(--grad);color:#fff;border-radius:20px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.pt{font-size:2.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.pb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pb button{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:12px;padding:8px 14px;cursor:pointer}
.pb #pgo{background:#fff;color:#4c1d95;font-weight:700}
.bar2{grid-column:1/-1;height:6px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
.bar2 i{display:block;height:100%;width:0;background:#fff;transition:width .5s linear}
.toast{position:fixed;inset-inline:16px;bottom:0;margin:0 auto calc(16px + env(safe-area-inset-bottom,0px));max-width:420px;background:#2e1065;color:#fff;border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;transform:translateY(200%);transition:transform .3s;z-index:50}
.toast.show{transform:none}
.hint{margin:10px 2px 0;font-size:.85rem;color:var(--muted)}
.hint.warn{color:var(--danger);font-weight:700}
.tools2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.tools2 .ghost{padding:10px 14px}
.toast button{background:#a78bfa;color:#1e1038;border:0;border-radius:10px;padding:6px 12px;font-weight:700;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div><h1>وقتي</h1><p class="sub" id="today"></p></div>
    <button class="ibtn" id="theme" aria-label="تبديل الوضع الليلي">◐</button>
  </div>
  <div class="progress">
    <div class="row"><span>إنجاز المهام</span><span id="pct">0%</span></div>
    <div class="bar"><i id="fill"></i></div>
  </div>
</header>

<main class="wrap">
  <section class="panel">
    <div class="tabs" id="tabs"><button data-t="all" class="on">الكل</button><button data-t="today">اليوم</button><button data-t="week">7 أيام</button><button data-t="late">متأخرة</button></div>
    <input class="search" id="q" type="search" placeholder="ابحث في المهام والملاحظات  (/)" aria-label="بحث">
    <div class="filters">
      <select id="fs" aria-label="الحالة"><option value="">كل الحالات</option><option value="open">قيد التنفيذ</option><option value="done">مكتملة</option></select>
      <select id="fp" aria-label="الأولوية"><option value="">كل الأولويات</option><option value="high">عالية</option><option value="mid">متوسطة</option><option value="low">منخفضة</option></select>
      <select id="fc" aria-label="التصنيف"><option value="">كل التصنيفات</option><option>عمل</option><option>دراسة</option><option>شخصي</option><option>صحة</option></select>
    </div>
    <div class="tools"><select id="sort" aria-label="الترتيب"><option value="date">ترتيب: بالموعد</option><option value="prio">ترتيب: بالأولوية</option><option value="new">ترتيب: الأحدث</option><option value="az">ترتيب: أبجدي</option></select><button class="ghost" id="clr">مسح المكتملة</button></div>
    <div class="tools2"><button class="ghost" id="exp">نسخة احتياطية</button><button class="ghost" id="imp">استرجاع نسخة</button><input type="file" id="file" accept=".json,application/json" hidden></div>
    <p class="hint" id="store" role="status"></p>
    <button class="add" id="new">إضافة مهمة (N)</button>
  </section>

  <section class="stats"><div><b id="s-today">0</b><span>مهام اليوم</span></div><div><b id="s-late">0</b><span>متأخرة</span></div><div><b id="s-done">0</b><span>مكتملة</span></div><div><b id="s-pomo">0</b><span>جلسات تركيز اليوم</span></div></section>
  <section class="pomo" aria-label="مؤقت التركيز"><div><div id="pm">وقت التركيز</div><div class="pt" id="pt">25:00</div></div><div class="pb"><button id="pgo">ابدأ</button><button id="prs">إعادة</button><button id="psw">تبديل</button></div><div class="bar2"><i id="pf"></i></div></section>
  <p class="count" id="count"></p>
  <ul id="list"></ul>
</main>

<dialog id="dlg">
  <form id="f" method="dialog">
    <h2 id="dt">مهمة جديدة</h2>
    <label>العنوان<input id="title" required maxlength="100"></label>
    <label>ملاحظات<textarea id="notes" rows="2" maxlength="300"></textarea></label>
    <div class="two">
      <label>التاريخ<input id="date" type="date"></label>
      <label>الوقت<input id="time" type="time"></label>
    </div>
    <div class="two">
      <label>الأولوية<select id="prio"><option value="high">عالية</option><option value="mid" selected>متوسطة</option><option value="low">منخفضة</option></select></label>
      <label>التصنيف<select id="cat"><option>عمل</option><option>دراسة</option><option>شخصي</option><option>صحة</option></select></label>
    </div>
    <label>التكرار<select id="rep"><option value="">بدون تكرار</option><option value="d">يومياً</option><option value="w">أسبوعياً</option></select></label>
    <div class="btns"><button type="button" class="cancel" id="cancel">إلغاء</button><button type="submit" class="save">حفظ المهمة</button></div>
  </form>
</dialog>

<script>
const KEY="waqti.tasks.v1";
let tasks=[],editId=null;
const $=id=>document.getElementById(id);
const PR={high:"عالية",mid:"متوسطة",low:"منخفضة"};

let storageOk=false;
function load(){
  try{localStorage.setItem("waqti.test","1");localStorage.removeItem("waqti.test");storageOk=true}catch(e){storageOk=false}
  try{const r=localStorage.getItem(KEY);tasks=r?JSON.parse(r):[]}catch(e){tasks=[]}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
}
function showStore(){const el=$("store");
  el.textContent=storageOk?"تُحفظ مهامك تلقائياً على هذا الجهاز ✓":"الحفظ التلقائي غير متاح في هذه الصفحة. نزّل نسخة احتياطية قبل الإغلاق.";
  el.className="hint"+(storageOk?"":" warn")}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks));storageOk=true}catch(e){storageOk=false}showStore()}
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

function render(){
  const q=$("q").value.trim().toLowerCase(),fs=$("fs").value,fp=$("fp").value,fc=$("fc").value;
  const list=tasks.filter(t=>
    (!q||(t.title+" "+t.notes).toLowerCase().includes(q))&&
    (!fs||(fs==="done")===t.done)&&(!fp||t.prio===fp)&&(!fc||t.cat===fc)&&tabOk(t)
  ).sort(sorter());
  const done=tasks.filter(t=>t.done).length,pct=tasks.length?Math.round(done/tasks.length*100):0;
  $("pct").textContent=pct+"%";$("fill").style.width=pct+"%";stats();
  $("count").textContent=tasks.length?`${list.length} من ${tasks.length} مهمة`:"";
  const ul=$("list");
  if(!list.length){
    ul.innerHTML=`<div class="empty">${tasks.length?"لا توجد مهام تطابق البحث أو الفلتر.":"لا توجد مهام بعد. اضغط على «إضافة مهمة» لتبدأ."}</div>`;return;
  }
  const td=todayStr();
  ul.innerHTML=list.map(t=>{
    const late=!t.done&&t.date&&t.date<td;
    return `<li class="p-${t.prio}${t.done?" done":""}" data-id="${t.id}">
      <input type="checkbox" class="chk" ${t.done?"checked":""} aria-label="إكمال المهمة">
      <div class="body"><div class="t">${esc(t.title)}</div>
        ${t.notes?`<div class="n">${esc(t.notes)}</div>`:""}
        <div class="meta"><span class="chip">${esc(t.cat)}</span><span class="chip">${PR[t.prio]}</span>${t.rep?`<span class="chip">تكرار ${t.rep==="d"?"يومي":"أسبوعي"}</span>`:""}
        ${t.date?`<span class="chip${late?" late":""}">${late?"متأخرة · ":""}${t.date}${t.time?" "+t.time:""}</span>`:""}</div></div>
      <div class="acts"><button class="edit">تعديل</button><button class="del">حذف</button></div></li>`;
  }).join("");
}

function openForm(t){
  editId=t?t.id:null;
  $("dt").textContent=t?"تعديل المهمة":"مهمة جديدة";
  $("title").value=t?t.title:"";$("notes").value=t?t.notes:"";
  $("date").value=t?t.date:todayStr();$("time").value=t?t.time:"";
  $("prio").value=t?t.prio:"mid";$("cat").value=t?t.cat:"عمل";$("rep").value=t&&t.rep?t.rep:"";
  $("dlg").showModal();$("title").focus();
}

$("new").onclick=()=>openForm();
$("cancel").onclick=()=>$("dlg").close();
$("f").addEventListener("submit",e=>{
  e.preventDefault();
  const v={title:$("title").value.trim(),notes:$("notes").value.trim(),date:$("date").value,time:$("time").value,prio:$("prio").value,cat:$("cat").value,rep:$("rep").value};
  if(!v.title)return;
  if(editId){Object.assign(tasks.find(t=>t.id===editId),v)}
  else tasks.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),done:false,...v});
  save();render();$("dlg").close();
});

$("list").addEventListener("click",e=>{
  const li=e.target.closest("li");if(!li)return;
  const t=tasks.find(x=>x.id===li.dataset.id);if(!t)return;
  if(e.target.classList.contains("chk")){t.done=e.target.checked;
    if(t.done&&t.rep&&t.date&&!t.spawned){t.spawned=true;tasks.push({...t,spawned:false,done:false,id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),date:addDays(t.date,t.rep==="d"?1:7)});toast("تمت جدولة المهمة القادمة تلقائياً")}
    save();render()}
  else if(e.target.classList.contains("edit"))openForm(t);
  else if(e.target.classList.contains("del")){
    const b=e.target;
    if(b.classList.contains("sure")){const idx=tasks.indexOf(t);tasks.splice(idx,1);save();render();toast("تم حذف المهمة","تراجع",()=>{tasks.splice(idx,0,t);save();render()})}
    else{b.classList.add("sure");b.textContent="تأكيد الحذف";setTimeout(()=>{b.classList.remove("sure");b.textContent="حذف"},3000)}
  }
});

["q","fs","fp","fc"].forEach(id=>$(id).addEventListener("input",render));

$("theme").onclick=()=>{
  const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.dataset.theme=dark?"light":"dark";
};

let tab="all",sortBy="date";
function addDays(s,n){const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function tabOk(t){const td=todayStr();
  if(tab==="today")return t.date===td;
  if(tab==="week")return !!t.date&&t.date>=td&&t.date<=addDays(td,7);
  if(tab==="late")return !t.done&&!!t.date&&t.date<td;
  return true}
function sorter(){const w={high:0,mid:1,low:2};
  return (a,b)=>{if(a.done!==b.done)return a.done-b.done;
    if(sortBy==="prio")return w[a.prio]-w[b.prio];
    if(sortBy==="az")return a.title.localeCompare(b.title,"ar");
    if(sortBy==="new")return b.id.localeCompare(a.id);
    return ((a.date||"9999")+(a.time||"")).localeCompare((b.date||"9999")+(b.time||""))}}
function pomoN(){try{const r=JSON.parse(localStorage.getItem("waqti.pomo")||"{}");return r.d===todayStr()?r.n:0}catch(e){return 0}}
function pomoAdd(){try{localStorage.setItem("waqti.pomo",JSON.stringify({d:todayStr(),n:pomoN()+1}))}catch(e){}}
function stats(){const td=todayStr();
  $("s-today").textContent=tasks.filter(t=>t.date===td&&!t.done).length;
  $("s-late").textContent=tasks.filter(t=>!t.done&&t.date&&t.date<td).length;
  $("s-done").textContent=tasks.filter(t=>t.done).length;
  $("s-pomo").textContent=pomoN()}
let tt;function toast(m,label,fn){let el=$("toast");
  if(!el){el=document.createElement("div");el.id="toast";el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}
  el.innerHTML="";const s=document.createElement("span");s.textContent=m;el.appendChild(s);
  if(fn){const b=document.createElement("button");b.textContent=label;b.onclick=()=>{fn();el.classList.remove("show")};el.appendChild(b)}
  requestAnimationFrame(()=>el.classList.add("show"));clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("show"),5000)}
$("tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.t;[...$("tabs").children].forEach(x=>x.classList.toggle("on",x===b));render()};
$("sort").onchange=()=>{sortBy=$("sort").value;render()};
$("clr").onclick=()=>{const gone=tasks.filter(t=>t.done);if(!gone.length){toast("لا توجد مهام مكتملة");return}
  tasks=tasks.filter(t=>!t.done);save();render();toast(`تم حذف ${gone.length} مهام مكتملة`,"تراجع",()=>{tasks=tasks.concat(gone);save();render()})};
document.addEventListener("keydown",e=>{if($("dlg").open||e.target.matches("input,textarea,select"))return;
  if(e.key==="n"||e.key==="ن"){e.preventDefault();openForm()}
  if(e.key==="/"){e.preventDefault();$("q").focus()}});
/* Pomodoro */
const POMO={focus:1500,brk:300};let pm="focus",left=POMO.focus,tick=null,endAt=0;
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function pShow(){$("pt").textContent=fmt(left);$("pm").textContent=pm==="focus"?"وقت التركيز":"وقت الاستراحة";
  $("pgo").textContent=tick?"إيقاف مؤقت":"ابدأ";$("pf").style.width=(100-left/POMO[pm]*100)+"%";
  document.title=tick?fmt(left)+" - وقتي":"وقتي – تنظيم المهام"}
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=660;g.gain.setValueAtTime(.2,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+1);o.start();o.stop(c.currentTime+1)}catch(e){}}
function pStop(){clearInterval(tick);tick=null}
function pDone(){pStop();beep();
  if(pm==="focus"){pomoAdd();stats();toast("أحسنت! جلسة تركيز مكتملة. خذ استراحة")}else toast("انتهت الاستراحة. لنعد للتركيز");
  pm=pm==="focus"?"brk":"focus";left=POMO[pm];pShow()}
$("pgo").onclick=()=>{if(tick){pStop();pShow();return}
  endAt=Date.now()+left*1000;
  tick=setInterval(()=>{left=Math.max(0,Math.round((endAt-Date.now())/1000));pShow();if(left===0)pDone()},500);pShow()};
$("prs").onclick=()=>{pStop();left=POMO[pm];pShow()};
$("psw").onclick=()=>{pStop();pm=pm==="focus"?"brk":"focus";left=POMO[pm];pShow()};
pShow();
/* Backup & restore */
async function exportData(){
  const data=JSON.stringify({app:"waqti",v:1,tasks},null,1),name="waqti-backup-"+todayStr()+".json";
  try{const d=window.claude?await claude.use("downloads"):null;
    if(d){await d.save({filename:name,data});toast("تم حفظ النسخة الاحتياطية");return}}
  catch(e){if(e&&e.code==="declined")return}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast("تم تنزيل النسخة الاحتياطية")}
  catch(e){toast("تعذر التنزيل")}}
$("exp").onclick=exportData;
$("imp").onclick=()=>$("file").click();
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result),arr=Array.isArray(o)?o:o.tasks;if(!Array.isArray(arr))throw 0;
    const ids=new Set(tasks.map(t=>String(t.id)));let n=0;
    arr.forEach(t=>{if(t&&t.title&&!ids.has(String(t.id))){tasks.push({id:String(t.id||Date.now().toString(36)+Math.random().toString(36).slice(2,6)),title:String(t.title).slice(0,100),notes:String(t.notes||"").slice(0,300),date:t.date||"",time:t.time||"",prio:PR[t.prio]?t.prio:"mid",cat:t.cat||"عمل",done:!!t.done,rep:t.rep||""});n++}});
    save();render();toast(`تم استرجاع ${n} مهمة`)}catch(err){toast("الملف غير صالح")}
    e.target.value=""};
  r.readAsText(f)};
$("today").textContent=new Date().toLocaleDateString("ar",{weekday:"long",day:"numeric",month:"long"});
load();showStore();render();
</script>
